{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau bénéficiaire</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ton CSS personnalisé -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Nouveau bénéficiaire</h3>
        </div>
        <div class="card-body">
            <form method="post" action="{% url 'ajouter_beneficiaire' %}">
                {% csrf_token %}

                <!-- Nom -->
                <div class="mb-3">
                    <label class="form-label">Nom de famille</label>
                    <input type="text" name="nom" class="form-control" required>
                </div>

                <!-- Prénom -->
                <div class="mb-3">
                    <label class="form-label">Prénom</label>
                    <input type="text" name="prenom" class="form-control" required>
                </div>

                <!-- Genre -->
                <div class="mb-3">
                    <label class="form-label">Genre</label>
                    <select name="genre" class="form-select" required>
                        <option value="Masculin">Masculin</option>
                        <option value="Féminin">Féminin</option>
                    </select>
                </div>

                <!-- Date de naissance -->
                <div class="mb-3">
                    <label class="form-label">Date de naissance</label>
                    <input type="date" name="date_naissance" class="form-control" required>
                </div>

                <!-- Village / Communauté -->
                <div class="mb-3">
                    <label class="form-label">Village / Communauté</label>
                    <input type="text" name="zone" class="form-control" required>
                </div>

                <!-- Tuteur -->
                <div class="mb-3">
                    <label class="form-label">Proche (Tuteur/Garant)</label>
                    <input type="text" name="tuteur" class="form-control">
                </div>

                <!-- Numéro identité -->
                <div class="mb-3">
                    <label class="form-label">Numéro d'identité</label>
                    <input type="text" name="numero_identite" class="form-control" required>
                </div>

                <!-- UUID Blockchain -->
                {% if uuid_genere %}
                <div class="alert alert-info">
                    <strong>UUID Blockchain généré :</strong> {{ uuid_genere }}
                </div>
                {% endif %}

                <!-- Message de doublon -->
                {% if message %}
                <div class="alert alert-danger">
                    {{ message }}
                </div>
                {% endif %}

                <!-- Type d’aide -->
                <div class="mb-3">
                    <label class="form-label">Type d’aide</label>
                    <div class="btn-group d-flex" role="group">
                        <input type="radio" class="btn-check" name="type_aide" id="alimentaire" value="Alimentaire" checked>
                        <label class="btn btn-outline-success flex-fill" for="alimentaire">Alimentaire</label>

                        <input type="radio" class="btn-check" name="type_aide" id="cash" value="Cash">
                        <label class="btn btn-outline-warning flex-fill" for="cash">Cash</label>

                        <input type="radio" class="btn-check" name="type_aide" id="medical" value="Médical">
                        <label class="btn btn-outline-danger flex-fill" for="medical">Médical</label>

                        <input type="radio" class="btn-check" name="type_aide" id="wash" value="WASH">
                        <label class="btn btn-outline-info flex-fill" for="wash">WASH</label>

                        <input type="radio" class="btn-check" name="type_aide" id="education" value="Éducation">
                        <label class="btn btn-outline-primary flex-fill" for="education">Éducation</label>
                    </div>
                </div>

                <!-- Bouton -->
                <button type="submit" class="btn btn-primary w-100">Enregistrer</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
