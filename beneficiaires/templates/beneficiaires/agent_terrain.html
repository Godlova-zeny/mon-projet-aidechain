{% extends 'base.html' %}
{% block title %}Agent terrain{% endblock %}

{% block content %}
<div class="mobile-page">
  <div class="mobile-topbar">
    <div class="brand-icon">A</div>
    <div>
      <div class="brand-title">Aide<span>Chain</span></div>
      <div class="brand-subtitle">Agent terrain</div>
    </div>
  </div>
  <div class="mobile-header">
    <h1>Agent terrain</h1>
    <p>Vérifie le doublon en temps réel avant l’inscription.</p>
  </div>

  <div id="js-messages"></div>

  <form id="mobile-form" method="post" novalidate>
    {% csrf_token %}
    <label for="nom">Nom</label>
    <input id="nom" name="nom" type="text" placeholder="Ex : Hassan" required>

    <label for="prenom">Prénom</label>
    <input id="prenom" name="prenom" type="text" placeholder="Ex : Fatima" required>

    <label for="zone">Zone / Village</label>
    <input id="zone" name="zone" type="text" placeholder="Ex : Goz Beida" required>

    <label for="type_aide">Type d’aide</label>
    <select id="type_aide" name="type_aide" required>
      <option value="">Sélectionner</option>
      <option value="Alimentaire">Alimentaire</option>
      <option value="Cash">Cash</option>
      <option value="Médical">Médical</option>
      <option value="WASH">WASH</option>
      <option value="Éducation">Éducation</option>
    </select>

    <label for="numero_identite">Numéro d’identité</label>
    <input id="numero_identite" name="numero_identite" type="text" placeholder="Ex : 12345678" required>
    <div id="doublon-message" class="doublon-info"></div>

    <button type="submit" id="submit-button">Enregistrer</button>
  </form>
</div>

<style>
.mobile-page {
  max-width: 480px;
  margin: 0 auto;
  background: #101b31;
  border: 1px solid #2b3b62;
  border-radius: 16px;
  padding: 18px;
  color: #f5f9ff;
}
.mobile-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #4b7bff;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
  font-size: 18px;
}
.brand-title {
  font-size: 18px;
  font-weight: 700;
}
.brand-title span {
  color: #8bb7ff;
}
.brand-subtitle {
  font-size: 12px;
  color: #d7e3ff;
  margin-top: 2px;
}
.mobile-header h1 {
  font-size: 24px;
  margin-bottom: 4px;
  color: #f5f9ff;
}
.mobile-header p {
  font-size: 13px;
  color: #d7e3ff;
  margin-bottom: 18px;
}
label {
  display: block;
  margin-top: 14px;
  font-size: 13px;
  color: #ffffff;
}
input, select {
  width: 100%;
  margin-top: 6px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid #39588f;
  background: #172743;
  color: #f5f9ff;
  font-size: 14px;
}
input::placeholder,
select option {
  color: #b8c6ed;
}
input:focus, select:focus {
  outline: 2px solid #4b7bff;
}
button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #4b7bff;
  color: #ffffff;
  font-weight: 700;
  cursor: pointer;
}
button:disabled {
  background: #3a4f7c;
  cursor: not-allowed;
}
.doublon-info {
  min-height: 22px;
  margin-top: 6px;
  font-size: 13px;
  color: #d7e3ff;
}
.doublon-info.ok { color: #6ee7b7; }
.doublon-info.error { color: #fca5a5; }
.alert {
  padding: 12px 14px;
  border-radius: 10px;
  margin-bottom: 14px;
  font-size: 13px;
}
.alert-success { background: #183a3c; color: #86efac; }
.alert-error { background: #3a1d23; color: #fca5a5; }
</style>

<script>
const numeroInput = document.getElementById('numero_identite');
const doublonMessage = document.getElementById('doublon-message');
const submitButton = document.getElementById('submit-button');
const mobileForm = document.getElementById('mobile-form');
const jsMessages = document.getElementById('js-messages');
let lastNumero = '';

// Vérification de doublon en temps réel (LocalStorage)
numeroInput.addEventListener('input', () => {
    const value = numeroInput.value.trim();
    if (!value || value === lastNumero) {
        doublonMessage.textContent = '';
        doublonMessage.className = 'doublon-info';
        return;
    }
    lastNumero = value;

    const registreLocal = JSON.parse(localStorage.getItem('aidechain_local_db') || '[]');
    const existe = registreLocal.some(b => b.numero_identite === value);

    if (existe) {
        doublonMessage.textContent = 'Doublon détecté : ce numéro existe déjà.';
        doublonMessage.className = 'doublon-info error';
        submitButton.disabled = true;
    } else {
        doublonMessage.textContent = 'Numéro valide, enregistrement possible.';
        doublonMessage.className = 'doublon-info ok';
        submitButton.disabled = false;
    }
});

// Enregistrement local (Mode Netlify)
mobileForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const data = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        zone: document.getElementById('zone').value,
        type_aide: document.getElementById('type_aide').value,
        numero_identite: document.getElementById('numero_identite').value,
        date_ajout: new Date().toLocaleDateString('fr-FR')
    };

    if (!data.nom || !data.numero_identite) return;

    let registreLocal = JSON.parse(localStorage.getItem('aidechain_local_db') || '[]');
    registreLocal.push(data);
    localStorage.setItem('aidechain_local_db', JSON.stringify(registreLocal));

    jsMessages.innerHTML = '<div class="alert alert-success">Bénéficiaire enregistré avec succès (Local).</div>';
    mobileForm.reset();
    doublonMessage.textContent = '';
});
</script>
{% endblock %}
