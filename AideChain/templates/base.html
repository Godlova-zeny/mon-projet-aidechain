{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1f3e">
    <meta name="description" content="AideChain - Plateforme de gestion des bénéficiaires avec vérification blockchain">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AideChain">
    
    <title>{% block title %}AideChain{% endblock %}</title>
    
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234a75e0' width='192' height='192'/><text x='96' y='120' font-size='100' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'>A</text></svg>">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid px-3">
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'liste_beneficiaires' %}">Liste</a>
                <a class="nav-link" href="{% url 'ajouter_beneficiaire' %}">Ajouter</a>
                <a class="nav-link" href="{% url 'agent_terrain' %}">Agent terrain</a>
                <a class="nav-link" href="{% url 'verifier_identite' %}">Vérifier identité</a>
            </div>
        </div>
    </nav>
    <main class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('{% static "service-worker.js" %}')
                    .then(registration => {
                        console.log('[PWA] Service Worker enregistré:', registration);
                        // Vérifier les mises à jour toutes les heures
                        setInterval(() => {
                            registration.update();
                        }, 3600000);
                    })
                    .catch(error => {
                        console.error('[PWA] Erreur lors de l\'enregistrement:', error);
                    });
            });

            // Écouter les mises à jour du service worker
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('[PWA] Nouvelle version du service worker activée');
                // Optionnel: recharger la page automatiquement
                // window.location.reload();
            });
        }
    </script>
</body>
</html>
